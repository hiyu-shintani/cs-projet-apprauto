[project]
name = "projet-soudures"
version = "0.1.0"
description = "Projet étudiant : résistance mécanique des soudures, ACP et semi-supervisé"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<1.9",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<0.14",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "tzdata>=2025.1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
